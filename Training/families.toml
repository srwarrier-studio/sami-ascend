# Invented values for the {slots} of the templates. Nothing here is a real name or figure.
[slots]
period = ["last month", "this month", "in October", "in July 2026", "this quarter", "last quarter", "this year", "in September 2025", "for the last three months", "in the third quarter", "this financial year", "in the first half", "yesterday", "last week", "in March", "in the previous quarter"]
customer = ["Lakeview Botanicals", "Nordhaven Pharma", "Brightwell Nutrition", "Orchard Bay Wellness", "Kestrel Life Sciences", "Alder and Finch", "Summit Naturals", "Harborline Foods", "Meridian Herbals", "Tamarind Health", "Quartz Aromatics", "Bluepine Supplements"]
supplier = ["Kaveri Growers", "Medan Agro Traders", "Nilgiri Farms Cooperative", "Saigon Spice Exports", "Deccan Solvents", "Mysore Packaging", "Coastline Chemicals", "Hosur Drums"]
material = ["curcumin 95", "turmeric extract", "black pepper extract", "ginger extract", "boswellia extract", "green tea extract", "ashwagandha extract", "vanillin", "ionone", "rose ketone"]
country = ["the USA", "Germany", "Japan", "the UAE", "Brazil", "South Korea", "the UK", "Canada", "Vietnam", "Australia"]
n = ["three", "five", "ten", "3", "5", "10"]
past = ["in December last year", "in March last year", "in the third quarter of last year", "last year", "in 2024", "in 2025", "for the whole of 2025"]
yoy = ["in 2026 compared to 2025", "in 2025 versus 2024", "for 2026 against 2025", "in 2024 compared with 2023", "this year compared to 2025"]
ask = ["show me", "tell me", "give me", "i need", "can you share", "kindly share", "let me know", "please show"]
ask_x = ["i would like to see", "could you pull up", "get me", "pls send", "i want to know", "any update on", "need to know"]
sales_noun = ["sales", "revenue", "turnover", "billing", "invoicing", "the top line"]
sales_noun_x = ["sales figures", "business done", "income from sales", "earnings", "sales numbers", "invoiced value"]
buy_noun = ["purchases", "spend", "buying", "procurement", "purchase cost", "outgoings"]
buy_noun_x = ["purchase figures", "money spent on buying", "procurement cost", "buying numbers", "import cost"]
sales_verb = ["did we sell", "did we earn", "did we make", "did we invoice", "did we bill", "did we book"]
sales_verb_x = ["did we turn over", "have we sold", "have we billed", "did the business do", "did we bring in"]
buy_verb = ["did we buy", "did we spend", "did we pay out", "did we procure", "did we order", "did we import"]
buy_verb_x = ["have we bought", "have we spent", "did we shell out", "have we imported", "did we put into buying"]
period_more = ["in Q2", "YTD", "so far this year", "since April", "in the last 30 days", "in fy 2025-26"]
period_more_x = ["in Q3", "MTD", "in the last 90 days", "for the half year", "in the current quarter", "since January"]
change = ["drop", "fall", "rise", "jump", "dip", "increase", "decline"]
change_x = ["slump", "surge", "slide", "spike", "swing"]
dir = ["down", "up", "lower", "higher"]
dir_x = ["weaker", "stronger", "softer", "firmer"]

