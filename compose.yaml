x-python: &python
  build:
    context: .
    dockerfile: infra/api/Dockerfile
  image: sami-ascend-api
  env_file: .env
  restart: unless-stopped

x-web: &web
  build:
    context: .
    dockerfile: infra/web/Dockerfile
  image: sami-ascend-web
  restart: unless-stopped

x-watch:
  - &rebuild-lock {action: rebuild, path: ./uv.lock}
  - &logging {action: sync+restart, path: ./packages/structured-logging/src, target: /app/packages/structured-logging/src, ignore: ["**/__pycache__"]}
  - &tokens {action: sync+restart, path: ./packages/token-verification/src, target: /app/packages/token-verification/src, ignore: ["**/__pycache__"]}
  - &rebuild-pnpm {action: rebuild, path: ./pnpm-lock.yaml}
  - &ui {action: sync, path: ./packages/ui/src, target: /app/packages/ui/src}
  - &ui-package {action: rebuild, path: ./packages/ui/package.json}

services:
  mock-sap:
    <<: *python
    command: butterfly
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      BUTTERFLY_DB: /data/mock-sap.db
    volumes:
      - mock-sap-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8003), 2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - *rebuild-lock
        - *logging
        - *tokens
        - {action: rebuild, path: ./apps/butterfly/pyproject.toml}
        - {action: sync+restart, path: ./apps/butterfly, target: /app/apps/butterfly, ignore: [tests, "**/__pycache__", "*.db", "*.jsonl", pyproject.toml]}
        - {action: sync+restart, path: ./docs/sap, target: /app/docs/sap}
  auth-api:
    <<: *python
    command: python -m auth_api.entrypoint.app
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_PATH: /data/auth.db
    volumes:
      - ./auth.db:/data/auth.db
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - *rebuild-lock
        - *logging
        - *tokens
        - {action: rebuild, path: ./apps/auth-api/pyproject.toml}
        - {action: sync+restart, path: ./apps/auth-api, target: /app/apps/auth-api, ignore: [tests, "**/__pycache__", "*.db", "*.jsonl", pyproject.toml]}
  synapse-api:
    <<: *python
    command: synapse-api
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      FRONTEND_URL: http://localhost:5174
      BOARDS_DB_PATH: /data/boards.db
      SAP_BASE_URL: http://mock-sap:8003/sap/opu/odata4/sap/zui_sales_o4/srvd_a2x/sap/zsales/0001/
      DRIVERS_BASE_URL: http://mock-sap:8003/sap/opu/odata4/sap/zui_drivers_o4/srvd_a2x/sap/zdrivers/0001/
      INVENTORY_BASE_URL: http://mock-sap:8003/sap/opu/odata4/sap/zui_inventory_o4/srvd_a2x/sap/zinventory/0001/
      PRODUCTION_BASE_URL: http://mock-sap:8003/sap/opu/odata4/sap/zui_production_o4/srvd_a2x/sap/zproduction/0001/
      EXPORT_BASE_URL: http://mock-sap:8003/sap/opu/odata4/sap/zui_export_o4/srvd_a2x/sap/zexport/0001/
      FINANCE_BASE_URL: http://mock-sap:8003/sap/opu/odata4/sap/zui_finance_o4/srvd_a2x/sap/zfinance/0001/
    volumes:
      - synapse-data:/data
    depends_on:
      mock-sap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8004), 2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - *rebuild-lock
        - *logging
        - *tokens
        - {action: rebuild, path: ./apps/synapse-api/pyproject.toml}
        - {action: sync+restart, path: ./apps/synapse-api, target: /app/apps/synapse-api, ignore: [tests, "**/__pycache__", "*.db", "*.jsonl", pyproject.toml]}
  workspace-api:
    <<: *python
    command: workspace-api
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      FRONTEND_URL: http://localhost:5173
      ORDER_DB: /data/orders.db
      SAP_BASE_URL: http://mock-sap:8003/sap/opu/odata4/sap/zui_sales_o4/srvd_a2x/sap/zsales/0001/
      SAP_REQUISITION_URL: http://mock-sap:8003/sap/opu/odata4/sap/api_purchaserequisition_2/srvd_a2x/sap/purchaserequisition/0001/
      SAP_RELEASE_URL: http://mock-sap:8003/butterfly/purchase-requisitions/
      SAP_PRODUCT_URL: http://mock-sap:8003/sap/opu/odata4/sap/api_product/srvd_a2x/sap/product/0001/
      SAP_PLANT_URL: http://mock-sap:8003/sap/opu/odata4/sap/api_plant_2/srvd_a2x/sap/plant/0001/
      SAP_PARTNER_URL: http://mock-sap:8003/sap/opu/odata/sap/API_BUSINESS_PARTNER/
    volumes:
      - workspace-data:/data
    depends_on:
      mock-sap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8002), 2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - *rebuild-lock
        - *logging
        - *tokens
        - {action: rebuild, path: ./apps/workspace-api/pyproject.toml}
        - {action: sync+restart, path: ./apps/workspace-api, target: /app/apps/workspace-api, ignore: [tests, "**/__pycache__", "*.db", "*.jsonl", pyproject.toml]}
  intent-api:
    <<: *python
    command: intent-api
    ports:
      - "127.0.0.1:8006:8006"
    environment:
      FRONTEND_URL: http://localhost:5174
      LAYA_URL: ${LAYA_URL:-http://onnx-classifier:8012}
      LAYA_MODEL: ${LAYA_MODEL:-typed-decisions}
      DOMAIN_MIN_PROBABILITY: "0.4"
      SYNAPSE_URL: http://synapse-api:8004
      UNANSWERED_LOG: /data/unanswered.jsonl
    volumes:
      - intent-data:/data
    depends_on:
      onnx-classifier:
        condition: service_healthy
      synapse-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8006), 2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - *rebuild-lock
        - *logging
        - *tokens
        - {action: rebuild, path: ./apps/intent-api/pyproject.toml}
        - {action: sync+restart, path: ./apps/intent-api, target: /app/apps/intent-api, ignore: [tests, "**/__pycache__", "*.db", "*.jsonl", pyproject.toml]}
        - {action: sync+restart, path: ./docs/sap, target: /app/docs/sap}
  onnx-classifier:
    build:
      context: apps/onnx-classifier
      dockerfile: ../../infra/onnx-classifier/Dockerfile
    ports:
      - "127.0.0.1:8012:8012"
    environment:
      THREADS: "2"
    volumes:
      - ./Training/classifier-model:/models/serve:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health')"]
      interval: 10s
      timeout: 3s
      retries: 12
    develop:
      watch:
        - {action: rebuild, path: ./apps/onnx-classifier/uv.lock}
        - {action: rebuild, path: ./apps/onnx-classifier/pyproject.toml}
        - {action: sync+restart, path: ./apps/onnx-classifier/src, target: /app/src, ignore: ["**/__pycache__"]}

  workspace-web:
    <<: *web
    command: pnpm --filter workspace-web exec vite --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      auth-api:
        condition: service_healthy
      workspace-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(5173, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
    develop:
      watch:
        - *rebuild-pnpm
        - *ui-package
        - *ui
        - {action: rebuild, path: ./apps/workspace-web/package.json}
        - {action: sync+restart, path: ./apps/workspace-web/vite.config.ts, target: /app/apps/workspace-web/vite.config.ts}
        - {action: sync, path: ./apps/workspace-web, target: /app/apps/workspace-web, ignore: [node_modules, dist, tests, package.json, vite.config.ts]}
  synapse-web:
    <<: *web
    command: pnpm --filter synapse-web exec vite --host 0.0.0.0 --port 5174 --strictPort
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      auth-api:
        condition: service_healthy
      synapse-api:
        condition: service_healthy
      intent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(5174, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
    develop:
      watch:
        - *rebuild-pnpm
        - *ui-package
        - *ui
        - {action: rebuild, path: ./apps/synapse-web/package.json}
        - {action: sync+restart, path: ./apps/synapse-web/vite.config.ts, target: /app/apps/synapse-web/vite.config.ts}
        - {action: sync, path: ./apps/synapse-web, target: /app/apps/synapse-web, ignore: [node_modules, dist, tests, package.json, vite.config.ts]}
  admin-web:
    <<: *web
    command: pnpm --filter admin-web exec vite --host 0.0.0.0 --port 5176 --strictPort
    ports:
      - "127.0.0.1:5176:5176"
    depends_on:
      auth-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(5176, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
    develop:
      watch:
        - *rebuild-pnpm
        - *ui-package
        - *ui
        - {action: rebuild, path: ./apps/admin-web/package.json}
        - {action: sync+restart, path: ./apps/admin-web/vite.config.ts, target: /app/apps/admin-web/vite.config.ts}
        - {action: sync, path: ./apps/admin-web, target: /app/apps/admin-web, ignore: [node_modules, dist, tests, package.json, vite.config.ts]}
volumes:
  mock-sap-data:
  synapse-data:
  workspace-data:
  intent-data:
