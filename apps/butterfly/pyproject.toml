[project]
name = "butterfly"
version = "0.1.0"
description = "Mock SAP serving the Sales OData V4 contract"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.161.1",
    "structured-logging",
]

[project.scripts]
butterfly = "butterfly.entrypoint.app:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
structured-logging = { workspace = true }
