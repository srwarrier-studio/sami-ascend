[project]
name = "synapse-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sarath", email = "silverfire92@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28.1",
    "pydantic-settings>=2",
    "structured-logging",
    "token-verification",
]

[project.scripts]
synapse-api = "synapse_api:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
structured-logging = { workspace = true }
token-verification = { workspace = true }
